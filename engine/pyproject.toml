[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semsearch"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers==3.3.1",
    "torch==2.6.0",
    "numpy==1.26.4",
    "snowballstemmer==3.1.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
semsearch = "semsearch.cli:main"

[tool.setuptools]
packages = ["semsearch"]
